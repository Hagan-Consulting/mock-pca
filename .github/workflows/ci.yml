# CI: Go checks and the OpenSSL end-to-end run on every pull request to main
# and on pushes to main.
#
# Supply-chain rules (see CLAUDE.md): every action is pinned to a full commit
# SHA (version in the trailing comment, updated by Dependabot), tools are pinned
# by exact version and SHA-256 (updated by hand), the token gets the least
# permissions per job and checkouts do not persist credentials.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use exactly the Go toolchain installed by setup-go (from go.mod); never
  # download another one implicitly.
  GOTOOLCHAIN: local

jobs:
  check:
    name: gofmt, vet, unit tests (race)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: bash scripts/check.sh
      - name: Fuzz the OCSP request decoder
        run: go test -run '^$' -fuzz FuzzParseRequest -fuzztime 20s ./internal/ocsp/

  e2e:
    name: OpenSSL end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: openssl version
      - run: bash scripts/e2e.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Upstream publishes no checksums. Digest computed from the release asset
      # and cross-checked with the sha256 that shellcheck-py records in its
      # setup.cfg for the same asset (PyPI shellcheck-py 0.11.0.1). On an
      # update: release public for at least a week, recompute the digest and
      # compare it with shellcheck-py's setup.cfg for the matching version.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck (pinned version and SHA-256)
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
      - name: Check the shellcheck on PATH is the pinned one
        run: |
          shellcheck --version
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION#v}"
      - run: shellcheck bin/mockpca scripts/*.sh examples/*.sh
