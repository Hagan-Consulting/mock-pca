# CI: Go checks, the OpenSSL end-to-end run and the container image test on
# every pull request to main; on pushes to main and release tags vX.Y.Z the
# same checks gate the multi-arch image publish to GHCR
# (publish-image.yml), which ends with the registry prune.
#
# Supply-chain rules (see CLAUDE.md): every action is pinned to a full commit
# SHA (version in the trailing comment, updated by Dependabot), base images in
# the Dockerfile by digest (Dependabot), tools by exact version and SHA-256
# (updated by hand), the token gets the least
# permissions per job and checkouts do not persist credentials.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use exactly the Go toolchain installed by setup-go (from go.mod); never
  # download another one implicitly.
  GOTOOLCHAIN: local

jobs:
  check:
    name: gofmt, vet, unit tests (race)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: bash scripts/check.sh
      - name: Fuzz the OCSP request decoder
        run: go test -run '^$' -fuzz FuzzParseRequest -fuzztime 20s ./internal/ocsp/

  e2e:
    name: OpenSSL end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: openssl version
      - run: bash scripts/e2e.sh

  container:
    name: container image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker version
      # Builds the image from the Dockerfile and runs the smoke test against it.
      - run: bash scripts/container-test.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Upstream publishes no checksums. Digest computed from the release asset
      # and cross-checked with the sha256 that shellcheck-py records in its
      # setup.cfg for the same asset (PyPI shellcheck-py 0.11.0.1). On an
      # update: release public for at least a week, recompute the digest and
      # compare it with shellcheck-py's setup.cfg for the matching version.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck (pinned version and SHA-256)
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"
      - name: Check the shellcheck on PATH is the pinned one
        run: |
          shellcheck --version
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION#v}"
      - run: shellcheck bin/mockpca scripts/*.sh examples/*.sh

  publish:
    name: publish image to GHCR
    if: github.event_name == 'push'
    needs: [check, e2e, container, shellcheck]
    # One publish (push, tag, attest, prune) at a time across all refs, so
    # the prune never sees the untagged per-architecture images of a publish
    # that is still running. queue: max keeps every pending publish instead
    # of cancelling all but the newest (it cannot be combined with
    # cancel-in-progress: true).
    concurrency:
      group: ghcr-publish-mock-pca
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/publish-image.yml
