# CI: Go checks and the OpenSSL end-to-end run on every pull request to main
# and on pushes to main.
#
# Supply-chain rules (see CLAUDE.md): every action is pinned to a full commit
# SHA (version in the trailing comment, updated by Dependabot), the token gets
# the least permissions per job and checkouts do not persist credentials.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Use exactly the Go toolchain installed by setup-go (from go.mod); never
  # download another one implicitly.
  GOTOOLCHAIN: local

jobs:
  check:
    name: gofmt, vet, unit tests (race)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: bash scripts/check.sh

  e2e:
    name: OpenSSL end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: openssl version
      - run: bash scripts/e2e.sh
