name: Bug report
description: mockpca, mockpca-lint or mockpca-serve does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go to the Security tab, not here (see SECURITY.md).
        Never paste private keys. Certificates and CSRs from a mock PKI are fine.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Commands to reproduce
      description: The commands you ran (from `mockpca init` if possible) and their full output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, and the output of `openssl version`, `bash --version | head -1` and `go version`.
      render: text
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: mock-pca version or commit
